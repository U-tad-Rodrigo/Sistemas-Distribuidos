<!DOCTYPE html>
<html lang="es">
<head>
    <title>Calculadora</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

    <script>


        $(document).ready(function(){
            $("button").click(function(){
                var vop1=document.getElementById("op1").value;
                var vop2=document.getElementById("op2").value;
                var vop =document.getElementById("op").value;

                //alert(op1+' '+op2+' '+op);
                var asd=$.get(
                    "https://25qgsrkiu4kv2i54quxsyqoybm0jtpcm.lambda-url.us-east-1.on.aws/",

                    {method: "operacion", op1 : vop1, op2 : vop2 , op : vop},
                    function(data) {

                        function jsonEscape(str)  {
                            return str.replace(/\n/g, "\\n").replace(/\r/g, "\\r").replace(/\t/g, "\\t").replace(/\//g,"");
                        }

                        var json=data;
                        alert('page content: ' + JSON.stringify(json));
                        //json=JSON.parse(JSON.stringify(json).replace(/\"/g,'"'));
                        document.getElementById("res").innerHTML="Resultado recibido:"+ json.res;
                        //window.location.replace(json.redirect);

                    }
                )
                    .done(function() {
                        alert( "second success" );
                    })
                    .fail(function(xhr, status, error) {
                        alert( error );
                    })

                asd.always(function() {
                    alert( "second finished" );
                });



            });
        });

    </script>

</head>
<body>

<label for="op1">Op1:</label>
<input type="text" id="op1" name="op1"><br><br>
<label for="op2">Op2:</label>
<input type="text" id="op2" name="op2"><br><br>
<label for="op">Operacion:</label>
<input type="text" id="op" name="op"><br><br>
<label id="res">Resultado: </label><br><br>


<button>Send an HTTP GET request to a page and get the result back</button>

</body>
</html>
