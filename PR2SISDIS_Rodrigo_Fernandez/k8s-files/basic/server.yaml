# Deployment y Service de Servers unificados

apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
      - name: server
        image: skitemplar/server-filemanager:v1
        command: ["/serverFileManager"]
        args:
        - "$(BROKER_SERVICE_SERVICE_HOST)"
        - "32002"
        - "$(MY_NODE_IP)"
        - "32001"
        env:
        - name: MY_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        ports:
        - containerPort: 32001

---

apiVersion: v1
kind: Service
metadata:
  name: server-service
spec:
  type: NodePort
  selector:
    app: server
  ports:
  - port: 32001
    targetPort: 32001
    nodePort: 30010
    protocol: TCP

