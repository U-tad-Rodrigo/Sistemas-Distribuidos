# Deployment y Service del Broker unificados

apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broker
  template:
    metadata:
      labels:
        app: broker
    spec:
      containers:
      - name: broker
        image: skitemplar/broker-filemanager:v1
        ports:
        - containerPort: 32002

---

apiVersion: v1
kind: Service
metadata:
  name: broker-service
spec:
  type: NodePort
  selector:
    app: broker
  ports:
  - port: 32002
    targetPort: 32002
    nodePort: 32002
    protocol: TCP

